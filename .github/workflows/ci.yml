name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Placeholder values: the build only needs well-formed env vars, it never
    # connects to the database or Clerk.
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations match db/schema.ts
        run: |
          npm run db:generate
          test -z "$(git status --porcelain drizzle)" || { echo "::error::db/schema.ts changed without a migration. Run npm run db:generate and commit drizzle/."; git status --porcelain drizzle; exit 1; }
      - run: npm run build
